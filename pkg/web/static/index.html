<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipper Studio — AI Video & Shorts Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --bg-surface: #101322;
      --bg-card: rgba(22, 27, 46, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.35);
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at 50% 0%, #171b38 0%, var(--bg) 75%);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 32px;
      background: rgba(10, 12, 22, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      font-size: 26px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }
    .badge-status {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .badge-status.busy {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fcd34d;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.97); }
    }

    main {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 28px;
      padding: 28px 32px;
      max-width: 1720px;
      margin: 0 auto;
    }

    @media (max-width: 1024px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 12px 36px -10px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Input & Search */
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }
    .text-input {
      flex: 1;
      padding: 12px 16px;
      background: rgba(15, 18, 33, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }
    .text-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .btn {
      padding: 11px 20px;
      border-radius: var(--radius-sm);
      border: none;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #4f46e5);
      color: white;
      box-shadow: 0 4px 14px var(--primary-glow);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-danger {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }
    .btn-danger:hover {
      background: rgba(244, 63, 94, 0.25);
    }

    /* Video Player */
    .player-wrap {
      background: #000;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      margin-bottom: 16px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Player Controls Bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(16, 20, 36, 0.8);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }
    .playhead-time {
      font-family: monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    /* Timestamp Trimmer */
    .trimmer-box {
      background: rgba(14, 18, 35, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      margin-bottom: 20px;
    }
    .trimmer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr auto;
      gap: 12px;
      align-items: flex-end;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .trim-action-btns {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .btn-mini {
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      cursor: pointer;
    }
    .btn-mini:hover { color: #fff; background: rgba(255, 255, 255, 0.15); }

    /* Configuration Panel */
    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 22px;
    }
    .toggle-card {
      background: rgba(18, 22, 40, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toggle-card label {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }
    .select-input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(10, 12, 22, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      font-size: 12px;
      outline: none;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .tab-btn {
      padding: 10px 18px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }
    .tab-btn.active {
      color: var(--primary);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    /* Segment List */
    .seg-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 540px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .seg-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 18, 33, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      transition: all 0.2s ease;
    }
    .seg-item:hover {
      border-color: rgba(99, 102, 241, 0.4);
      transform: translateX(2px);
    }
    .seg-time {
      font-family: monospace;
      font-weight: 700;
      color: var(--accent-cyan);
      font-size: 13px;
    }

    /* Clips Gallery */
    .clips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .clip-card {
      background: rgba(15, 18, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .clip-card:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .clip-thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .clip-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .clip-info {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .clip-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .clip-meta {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Progress & Toast */
    .progress-wrap {
      background: rgba(15, 18, 33, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-top: 20px;
      display: none;
    }
    .progress-bar-bg {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
      transition: width 0.3s ease;
      box-shadow: 0 0 12px var(--primary);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-logo">⚡ CLIPPER STUDIO</div>
      <div class="badge" id="portBadge">LOCAL DASHBOARD</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="badge badge-status" id="statusBadge">● READY / IDLE</div>
    </div>
  </header>

  <main>
    <!-- Left Column: Video Player, Trimmer, & Controls -->
    <div class="panel">
      <h2 class="section-title">🎬 Video Source & Interactive Player</h2>
      <div class="input-group">
        <input type="text" id="videoSource" class="text-input" placeholder="Enter local video path (e.g. video.mp4) or YouTube URL..." />
        <button class="btn btn-secondary" onclick="loadSourceVideo()">Load Video</button>
      </div>

      <div class="player-wrap" id="playerContainer">
        <video id="mainPlayer" controls></video>
      </div>

      <div class="controls-bar">
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary btn-mini" onclick="seekRelative(-1)">-1s</button>
          <button class="btn btn-secondary btn-mini" onclick="seekRelative(-0.1)">-0.1s</button>
          <button class="btn btn-secondary btn-mini" onclick="seekRelative(0.1)">+0.1s</button>
          <button class="btn btn-secondary btn-mini" onclick="seekRelative(1)">+1s</button>
        </div>
        <div class="playhead-time" id="playheadTime">00:00.00 / 00:00.00</div>
      </div>

      <!-- Segment Trimmer -->
      <div class="trimmer-box">
        <div class="trimmer-grid">
          <div class="form-group">
            <label>Start Timestamp</label>
            <input type="text" id="trimStart" class="text-input" value="00:00" placeholder="00:00" />
            <div class="trim-action-btns">
              <button class="btn-mini" onclick="markCurrent('start')">📍 Mark Current</button>
            </div>
          </div>
          <div class="form-group">
            <label>End Timestamp</label>
            <input type="text" id="trimEnd" class="text-input" value="00:30" placeholder="00:30" />
            <div class="trim-action-btns">
              <button class="btn-mini" onclick="markCurrent('end')">📍 Mark Current</button>
            </div>
          </div>
          <div class="form-group">
            <label>Segment Title (Optional)</label>
            <input type="text" id="trimTitle" class="text-input" placeholder="e.g. Epic Hook Moment" />
          </div>
          <div class="form-group">
            <button class="btn btn-secondary" onclick="addSegment()">➕ Add Segment</button>
          </div>
        </div>
      </div>

      <!-- Settings & Form Options -->
      <h2 class="section-title">⚙️ Clip Render Settings</h2>
      <div class="config-grid">
        <div class="toggle-card">
          <label>Shorts (9:16) <input type="checkbox" id="cfgShorts" checked /></label>
          <select id="cfgShortsStyle" class="select-input">
            <option value="crop">Center Crop</option>
            <option value="smart-crop" selected>Smart Crop (Face Tracker)</option>
            <option value="blur">Blurred Background</option>
          </select>
        </div>

        <div class="toggle-card">
          <label>Burn Subtitles <input type="checkbox" id="cfgBurnSubs" checked /></label>
          <select id="cfgSubPreset" class="select-input">
            <option value="hormozi" selected>Hormozi (Bounce TikTok)</option>
            <option value="neon">Neon Cyan Glow</option>
            <option value="minimal">Minimal White</option>
            <option value="cinematic">Cinematic Soft</option>
          </select>
        </div>

        <div class="toggle-card">
          <label>Audio Normalization <input type="checkbox" id="cfgLoudnorm" checked /></label>
          <label style="font-size:11px; color:var(--text-muted);">EBU R128 (-14.0 LUFS)</label>
        </div>

        <div class="toggle-card">
          <label>Jump-Cut Silence <input type="checkbox" id="cfgJumpCut" /></label>
          <label style="font-size:11px; color:var(--text-muted);">Auto-remove silent pauses</label>
        </div>

        <div class="toggle-card">
          <label>AI Social Metadata <input type="checkbox" id="cfgMetadata" checked /></label>
          <label style="font-size:11px; color:var(--text-muted);">Hook title & virality score</label>
        </div>

        <div class="toggle-card">
          <label>Cover Thumbnail <input type="checkbox" id="cfgThumbnail" checked /></label>
          <label style="font-size:11px; color:var(--text-muted);">Best face expression .jpg</label>
        </div>

        <div class="toggle-card">
          <label>Hardware Accel</label>
          <select id="cfgHwaccel" class="select-input">
            <option value="auto" selected>Auto-Detect GPU</option>
            <option value="nvenc">NVIDIA NVENC</option>
            <option value="videotoolbox">Apple VideoToolbox</option>
            <option value="qsv">Intel QuickSync</option>
            <option value="cpu">Software CPU</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary" style="width:100%; padding:14px; font-size:16px; justify-content:center;" onclick="startClippingJob()">
        ⚡ START CLIPPING
      </button>

      <div class="progress-wrap" id="progressWrap">
        <div style="display:flex; justify-content:space-between; font-size:13px; font-weight:600;">
          <span id="progressTitle">Rendering segments...</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>
    </div>

    <!-- Right Column: Queue & Exported Clips Gallery -->
    <div class="panel">
      <div class="tabs">
        <button class="tab-btn active" id="tabQueueBtn" onclick="switchTab('queue')">Segments Queue (<span id="queueCount">0</span>)</button>
        <button class="tab-btn" id="tabClipsBtn" onclick="switchTab('clips')">Exported Clips (<span id="clipsCount">0</span>)</button>
      </div>

      <!-- Tab: Segments Queue -->
      <div id="tabQueue">
        <div class="seg-list" id="segList">
          <p style="color:var(--text-muted); font-size:13px; text-align:center; padding:30px;">
            No segments added yet. Use the trimmer on the left to mark start & end timestamps!
          </p>
        </div>
      </div>

      <!-- Tab: Exported Clips Gallery -->
      <div id="tabClips" style="display:none;">
        <div class="clips-grid" id="clipsGrid">
          <p style="color:var(--text-muted); font-size:13px; text-align:center; padding:30px; grid-column: 1/-1;">
            No rendered clips in ./clips yet.
          </p>
        </div>
      </div>
    </div>
  </main>

  <script>
    const player = document.getElementById('mainPlayer');
    let segments = [];
    let pollTimer = null;

    player.addEventListener('timeupdate', () => {
      const cur = player.currentTime || 0;
      const dur = player.duration || 0;
      document.getElementById('playheadTime').textContent = formatSeconds(cur) + ' / ' + formatSeconds(dur);
    });

    function formatSeconds(sec) {
      if (isNaN(sec) || sec < 0) return "00:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const pad = (n) => (n < 10 ? '0' + n : n);
      return pad(m) + ':' + pad(s);
    }

    function parseSeconds(str) {
      const parts = str.trim().split(':');
      if (parts.length === 2) {
        return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
      } else if (parts.length === 3) {
        return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
      }
      return parseFloat(str) || 0;
    }

    function seekRelative(delta) {
      if (!isNaN(player.duration)) {
        player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + delta));
      }
    }

    function markCurrent(target) {
      const cur = player.currentTime || 0;
      const fmt = formatSeconds(cur);
      if (target === 'start') {
        document.getElementById('trimStart').value = fmt;
      } else {
        document.getElementById('trimEnd').value = fmt;
      }
    }

    function addSegment() {
      const start = document.getElementById('trimStart').value.trim();
      const end = document.getElementById('trimEnd').value.trim();
      const title = document.getElementById('trimTitle').value.trim();

      if (!start || !end) {
        alert("Please specify start and end timestamps.");
        return;
      }

      segments.push({ start, end, title });
      document.getElementById('trimTitle').value = "";
      renderSegments();
    }

    function removeSegment(idx) {
      segments.splice(idx, 1);
      renderSegments();
    }

    function seekToSegment(startStr) {
      const sec = parseSeconds(startStr);
      player.currentTime = sec;
      player.play();
    }

    function renderSegments() {
      const list = document.getElementById('segList');
      document.getElementById('queueCount').textContent = segments.length;

      if (segments.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:30px;">No segments added yet.</p>';
        return;
      }

      list.innerHTML = segments.map((s, i) => `
        <div class="seg-item">
          <div>
            <div style="font-weight:600; font-size:13.5px; margin-bottom:4px;">
              ${s.title ? s.title : 'Segment #' + (i + 1)}
            </div>
            <div class="seg-time">⏱ ${s.start} ➔ ${s.end}</div>
          </div>
          <div style="display:flex; gap:8px;">
            <button class="btn btn-secondary btn-mini" onclick="seekToSegment('${s.start}')">▶ Seek</button>
            <button class="btn btn-danger btn-mini" onclick="removeSegment(${i})">✕</button>
          </div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      document.getElementById('tabQueueBtn').classList.toggle('active', tab === 'queue');
      document.getElementById('tabClipsBtn').classList.toggle('active', tab === 'clips');
      document.getElementById('tabQueue').style.display = tab === 'queue' ? 'block' : 'none';
      document.getElementById('tabClips').style.display = tab === 'clips' ? 'block' : 'none';
      if (tab === 'clips') loadClipsGallery();
    }

    function loadSourceVideo() {
      const src = document.getElementById('videoSource').value.trim();
      if (!src) {
        alert("Please enter a video file path or URL");
        return;
      }

      if (src.startsWith("http://") || src.startsWith("https://")) {
        alert("YouTube URL configured. You can mark segments by time; video will be downloaded during clipping.");
      } else {
        // Stream preview via local server
        player.src = '/preview?path=' + encodeURIComponent(src);
        player.load();
      }
    }

    async function loadClipsGallery() {
      try {
        const res = await fetch('/api/clips');
        const data = await res.json();
        const grid = document.getElementById('clipsGrid');
        document.getElementById('clipsCount').textContent = data.length || 0;

        if (!data || data.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-muted); font-size:13px; text-align:center; padding:30px; grid-column: 1/-1;">No rendered clips found in ./clips directory.</p>';
          return;
        }

        grid.innerHTML = data.map(c => `
          <div class="clip-card">
            <div class="clip-thumb-wrap">
              ${c.thumbnail_url ? '<img src="' + c.thumbnail_url + '" class="clip-thumb" />' : '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;">No Thumbnail</div>'}
            </div>
            <div class="clip-info">
              <div class="clip-name" title="${c.name}">${c.name}</div>
              <div class="clip-meta">
                <span>📦 ${c.size_str}</span>
                <span>⏱ ${c.duration_str}</span>
              </div>
              <div style="display:flex; gap:6px; margin-top:8px;">
                <a href="${c.url}" target="_blank" class="btn btn-primary btn-mini" style="flex:1; text-align:center; text-decoration:none;">▶ Play</a>
                <a href="${c.url}" download class="btn btn-secondary btn-mini">⬇</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Failed loading clips gallery:", err);
      }
    }

    async function startClippingJob() {
      const input = document.getElementById('videoSource').value.trim();
      if (!input) {
        alert("Please specify a video input file or YouTube URL.");
        return;
      }
      if (segments.length === 0) {
        alert("Please add at least 1 segment to the queue.");
        return;
      }

      const payload = {
        input_file: input,
        segments: segments,
        shorts: document.getElementById('cfgShorts').checked,
        shorts_style: document.getElementById('cfgShortsStyle').value,
        burn_subtitles: document.getElementById('cfgBurnSubs').checked,
        sub_preset: document.getElementById('cfgSubPreset').value,
        sub_emoji: true,
        loudnorm: document.getElementById('cfgLoudnorm').checked,
        jump_cut: document.getElementById('cfgJumpCut').checked,
        generate_metadata: document.getElementById('cfgMetadata').checked,
        extract_thumbnail: document.getElementById('cfgThumbnail').checked,
        thumbnail_count: 1,
        hwaccel: document.getElementById('cfgHwaccel').value
      };

      try {
        const res = await fetch('/api/clip', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          alert("Error starting job: " + (data.error || "Unknown error"));
          return;
        }

        document.getElementById('progressWrap').style.display = 'block';
        startPollingStatus();
      } catch (err) {
        alert("Failed to connect to server: " + err);
      }
    }

    function startPollingStatus() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/status');
          const st = await res.json();

          const badge = document.getElementById('statusBadge');
          if (st.is_running) {
            badge.textContent = '⚡ RENDERING (' + st.progress_pct + '%)';
            badge.className = 'badge badge-status busy';
            document.getElementById('progressTitle').textContent = st.current_task || 'Rendering...';
            document.getElementById('progressPct').textContent = st.progress_pct + '%';
            document.getElementById('progressBarFill').style.width = st.progress_pct + '%';
          } else {
            badge.textContent = '● READY / IDLE';
            badge.className = 'badge badge-status';
            if (st.last_error) {
              document.getElementById('progressTitle').textContent = 'Error: ' + st.last_error;
            } else if (st.completed) {
              document.getElementById('progressTitle').textContent = '✅ All segments completed!';
              document.getElementById('progressBarFill').style.width = '100%';
              document.getElementById('progressPct').textContent = '100%';
              switchTab('clips');
            }
            clearInterval(pollTimer);
            pollTimer = null;
          }
        } catch (err) {
          console.error("Status poll error:", err);
        }
      }, 1000);
    }

    // Initial load
    loadClipsGallery();
  </script>
</body>
</html>
